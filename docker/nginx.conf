# CenSV static site.
#
# Port 8080, not 80: the container runs as the unprivileged `nginx` user and cannot bind a
# privileged port. ECS maps it, so nothing downstream sees the difference.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The catalog is ~2.9 MB of JSON and compresses to roughly a seventh of that. Without
    # this the first paint pulls the whole thing uncompressed, which is the single largest
    # thing that would make this site feel slow.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/css text/plain
                      image/svg+xml application/manifest+json;

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Data is NOT content-addressed - it changes when the image is rebuilt under the same
    # path. Revalidate so a redeploy is never masked by a stale cache.
    location /data/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routing is hash-based, so every real path is a file. Anything else is a 404 rather
    # than a silent rewrite to index.html, which would turn a missing asset into a blank page.
    location / {
        try_files $uri $uri/ =404;
    }

    # Deployed on a private network, but these cost nothing and close the obvious gaps.
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "no-referrer"    always;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;
}
